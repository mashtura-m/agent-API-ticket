  <style>
/* Helpdesk Mobile — design tokens */
:root {
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F1F5F9;
  --surface-3: #E4EBF2;
  --line: #DCE4EC;
  --ink: #1C2733;
  --ink-2: #55657A;
  --ink-3: #8796A8;
  --orange: #C25A24;
  --orange-600: #A9491A;
  --orange-soft: #FCEBE0;
  --purple: #6A3FB0;
  --purple-600: #56318F;
  --purple-soft: #F1EAFB;
  --purple-line: #D7C4F2;
  --blue: #2F6FB3;
  --green: #2E8B5E;
  --amber: #B7791F;
  --red: #C0392B;
  --page-bg: #D8E1EB;
  --chat-bg: linear-gradient(180deg, #EEF3F8 0%, #E1EAF3 100%);
  --radius: 18px;
  --shadow: 0 1px 2px rgba(28, 39, 51, .06), 0 6px 18px -12px rgba(28, 39, 51, .22);
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Fraunces', Georgia, serif;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --bg: #0F1720;
  --surface: #17212C;
  --surface-2: #1E2A37;
  --surface-3: #263446;
  --line: #2A3A4D;
  --ink: #EAF0F6;
  --ink-2: #A6B5C6;
  --ink-3: #74859B;
  --orange-soft: #3A2316;
  --purple-soft: #2A1F40;
  --purple-line: #4A3870;
  --page-bg: #070C12;
  --chat-bg: linear-gradient(180deg, #0E1823 0%, #101D2A 100%);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px -12px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--page-bg);
  display: grid;
  place-items: center;
  font-family: var(--font-ui);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
#root { width: 100%; display: flex; justify-content: center; min-width: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .conv:focus-visible, [contenteditable]:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--blue) 55%, transparent);
  outline-offset: 2px;
}
.ic { width: 20px; height: 20px; flex: none; }
.muted { color: var(--ink-2); }

.phone {
  position: relative;
  width: 390px;
  height: 844px;
  max-height: calc(100dvh - 24px);
  background: var(--bg);
  border-radius: 44px;
  box-shadow: 0 30px 80px -30px rgba(20, 30, 45, .45);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  isolation: isolate;
}
@media (max-width: 520px) {
  body { display: block; }
  .phone { width: 100%; height: 100dvh; max-height: none; border-radius: 0; box-shadow: none; }
}

.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 16px 18px 8px; }
.topbar h1 { font: 600 27px/1.1 var(--font-display); margin: 0; letter-spacing: -.01em; }
.topbar p { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; }
.tb-right { display: flex; align-items: center; gap: 8px; flex: none; }
.content { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 120px; -webkit-overflow-scrolling: touch; }

.tabbar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: var(--surface);
  border-top: 1px solid var(--line);
  padding: 6px 4px calc(8px + env(safe-area-inset-bottom));
}
.tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: 0; color: var(--ink-3); font: 600 11px var(--font-ui); padding: 6px 0; min-height: 52px; }
.tab.on { color: var(--orange); }
.tab .badge { position: absolute; top: 2px; left: calc(50% + 6px); }
.badge { background: var(--orange); color: #fff; font: 700 11px var(--font-ui); min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding: 0 6px; }
.badge.purple { background: var(--purple); }
.badge.blue { background: var(--blue); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 999px; padding: 12px 18px; font: 600 14px var(--font-ui); min-height: 44px; transition: transform .12s; }
.btn .ic { width: 16px; height: 16px; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--orange); color: #fff; }
.btn.primary:hover { background: var(--orange-600); }
.btn.purple { background: var(--purple); color: #fff; }
.btn.ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn.danger { background: transparent; color: var(--red); box-shadow: inset 0 0 0 1px #E8B4AF; }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; padding: 8px 14px; font-size: 13px; }

.icon-btn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--surface-2); color: var(--ink); display: grid; place-items: center; flex: none; }
.icon-btn.plain { background: transparent; }
.icon-btn.accent { color: var(--orange); }
.icon-btn.on { background: var(--orange-soft); color: var(--orange); }

.seg { display: flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--ink-2); font: 600 13px var(--font-ui); padding: 8px 12px; border-radius: 999px; min-height: 36px; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.seg.mini button { padding: 5px 10px; font-size: 12px; min-height: 28px; }

.chip { display: inline-flex; align-items: center; gap: 4px; font: 600 11px var(--font-ui); padding: 4px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip .ic { width: 12px; height: 12px; }
.chip.ai { background: var(--purple-soft); color: var(--purple); }
.chip.hot { background: var(--orange-soft); color: var(--orange-600); }
.chip.urgent { background: #FBE3E0; color: var(--red); }
.chip.ok { background: #E2F3EA; color: var(--green); }
.chip.blue { background: #E4EEF9; color: var(--blue); }
.chip.pick { border: 0; cursor: pointer; font-size: 12px; padding: 6px 10px; min-height: 30px; }
.chip.pick:hover { background: var(--purple-soft); color: var(--purple); }

.av-wrap { position: relative; flex: none; display: inline-flex; }
.av { --h: 20; width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, hsl(var(--h) 60% 62%), hsl(calc(var(--h) + 40) 55% 44%)); color: #fff; font: 600 15px var(--font-ui); display: grid; place-items: center; flex: none; }
.av.sm { width: 36px; height: 36px; font-size: 13px; }
.av.xs { width: 24px; height: 24px; font-size: 9px; }
.av.lg { width: 96px; height: 96px; font: 600 30px var(--font-display); }
.ch-badge { position: absolute; right: -3px; bottom: -3px; width: 18px; height: 18px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }
.ch-badge .ic { width: 10px; height: 10px; }
.status-dot { position: absolute; left: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--s); box-shadow: 0 0 0 2px var(--bg); }

.searchbar { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 0 14px; height: 44px; color: var(--ink-3); margin: 10px 0; }
.searchbar input { flex: 1; min-width: 0; border: 0; background: transparent; font: 500 15px var(--font-ui); color: var(--ink); outline: none; }
.searchbar input::placeholder { color: var(--ink-3); }

.row-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 8px; }
.row-scroll::-webkit-scrollbar { display: none; }
.pill { flex: none; border: 0; border-radius: 999px; background: var(--surface); color: var(--ink-2); font: 600 13px var(--font-ui); padding: 8px 13px; box-shadow: inset 0 0 0 1px var(--line); min-height: 36px; display: flex; align-items: center; gap: 6px; }
.pill .ic { width: 15px; height: 15px; }
.pill b { font-weight: 700; color: var(--ink-3); }
.pill.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.pill.on b { color: var(--orange); }

.list { display: flex; flex-direction: column; gap: 8px; }
.label { font: 600 12px var(--font-ui); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 18px 4px 8px; }
.group-label { font: 600 12px var(--font-ui); color: var(--ink-3); margin: 14px 4px 6px; }
.note { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; color: var(--ink-3); margin: 4px 2px 0; line-height: 1.4; }
.note .ic { width: 14px; height: 14px; margin-top: 1px; }
.link { background: none; border: 0; color: var(--blue); font: 600 13px var(--font-ui); padding: 8px 0 0; }
.empty { text-align: center; padding: 40px 20px; color: var(--ink-2); }
.empty .ic { width: 34px; height: 34px; color: var(--ink-3); margin-bottom: 8px; }
.empty b { display: block; color: var(--ink); font: 600 16px var(--font-display); margin-bottom: 4px; }

.fab { position: absolute; right: 18px; bottom: 96px; height: 52px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--orange); color: #fff; font: 600 14px var(--font-ui); display: flex; gap: 8px; align-items: center; box-shadow: 0 14px 30px -12px rgba(194, 90, 36, .7); z-index: 4; }
.fab .ic { width: 18px; height: 18px; }

.card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; }
.card h3 { margin: 0 0 10px; font: 600 15px var(--font-ui); display: flex; align-items: center; gap: 8px; }
.card h3 .ic { width: 17px; height: 17px; color: var(--ink-2); }
.card h3 .link { margin-left: auto; padding: 0; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.kpi { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
.kpi span { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.kpi b { display: block; font: 600 26px/1.15 var(--font-display); margin-top: 4px; }
.kpi small { font-size: 12px; color: var(--ink-3); }
.kpi.alert b { color: var(--orange); }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 84px; }
.bars div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
.bars i { display: block; background: linear-gradient(180deg, var(--blue), color-mix(in srgb, var(--blue) 55%, var(--surface-3))); border-radius: 5px 5px 2px 2px; min-height: 4px; }
.bars span { font-size: 9px; color: var(--ink-3); text-align: center; margin-top: 4px; }

.conv { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: 18px; padding: 12px; box-shadow: var(--shadow); cursor: pointer; user-select: none; -webkit-user-select: none; }
.conv:active { transform: scale(.99); }
.conv.sel { box-shadow: inset 0 0 0 2px var(--orange); }
.conv-body { flex: 1; min-width: 0; }
.row1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.row1 b { font: 600 15px var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row1 time { font-size: 12px; color: var(--ink-3); flex: none; }
.prev { margin: 2px 0 6px; color: var(--ink-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
.prev .ic { width: 15px; height: 15px; color: var(--blue); flex: none; }
.conv.unread .prev { color: var(--ink); font-weight: 500; }
.conv.unread .row1 b { font-weight: 700; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.conv-end { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.check { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--ink-3); display: grid; place-items: center; flex: none; color: #fff; }
.check.on { background: var(--orange); box-shadow: none; }
.check .ic { width: 14px; height: 14px; }

.bulkbar { position: absolute; left: 12px; right: 12px; bottom: 84px; background: var(--ink); color: var(--bg); border-radius: 22px; padding: 8px 10px; display: flex; align-items: center; gap: 6px; box-shadow: 0 18px 40px -12px rgba(0, 0, 0, .5); z-index: 5; animation: rise .25s; }
.bulkbar .count { font: 600 14px var(--font-ui); margin-right: auto; padding-left: 6px; white-space: nowrap; }
.bulkbar button { border: 0; background: rgba(255, 255, 255, .1); color: inherit; border-radius: 14px; padding: 8px 10px; font: 600 12px var(--font-ui); display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 56px; }
.bulkbar button .ic { width: 18px; height: 18px; }
.bulkbar button:disabled { opacity: .4; }
.bulkbar .x { background: none; min-width: 36px; }

.rev { background: var(--surface); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); border: 1px dashed var(--purple-line); margin-bottom: 10px; }
.rev-head { display: flex; gap: 10px; align-items: center; }
.rev-head > div { flex: 1; min-width: 0; }
.rev-head b { display: block; }
.rev-head span { font-size: 12px; color: var(--ink-3); }
.why { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--purple); background: var(--purple-soft); padding: 8px 10px; border-radius: 12px; margin: 10px 0; line-height: 1.4; }
.why .ic { width: 16px; height: 16px; margin-top: 1px; }
.draft { font-size: 14px; line-height: 1.5; background: var(--surface-2); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.row-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.row-actions .ic { width: 15px; height: 15px; }

.group { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 0 14px; margin-bottom: 12px; }
.setrow { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; padding: 14px 0; border-top: 1px solid var(--line); text-align: left; min-height: 56px; }
.group > .setrow:first-child { border-top: 0; }
.setrow .ic { color: var(--blue); width: 20px; height: 20px; }
.setrow > span { flex: 1; min-width: 0; }
.setrow b { display: block; font: 600 15px var(--font-ui); }
.setrow small { color: var(--ink-2); font-size: 12px; }
.setrow > .chev { color: var(--ink-3); width: 18px; height: 18px; }
.rule { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
.group .rule:first-child { border-top: 0; }
.rule > div { flex: 1; min-width: 0; }
.rule b { font-size: 14px; }
.rule small { display: block; color: var(--ink-2); font-size: 12px; margin-top: 2px; line-height: 1.4; }
.switch { width: 50px; height: 30px; border-radius: 999px; border: 0; background: var(--surface-3); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: transform .2s; }
.switch.on { background: var(--blue); }
.switch.on::after { transform: translateX(20px); }
.select { border: 0; background: var(--surface-2); border-radius: 12px; padding: 9px 30px 9px 12px; font: 600 13px var(--font-ui); min-height: 36px; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }

.layer { position: absolute; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; animation: slideIn .28s cubic-bezier(.2, .8, .2, 1); }
.chat-head { display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 4px; background: var(--surface); border-bottom: 1px solid var(--line); }
.head-id { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: none; border: 0; text-align: left; padding: 0 4px; }
.head-id > span { display: flex; flex-direction: column; min-width: 0; }
.head-id b { font: 600 15px var(--font-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head-id small { color: var(--ink-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; font-size: 13px; font-weight: 500; }
.bar .ic { width: 16px; height: 16px; }
.bar span { flex: 1; }
.bar .btn { min-height: 32px; padding: 6px 12px; font-size: 12px; }
.bar.ai { background: var(--purple-soft); color: var(--purple); }
.bar.snooze, .bar.closed { background: var(--surface-2); color: var(--ink-2); }
.msgs { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 3px; background: var(--chat-bg); }
.day-chip { align-self: center; font: 600 12px var(--font-ui); color: var(--ink-2); background: color-mix(in srgb, var(--surface) 80%, transparent); padding: 4px 10px; border-radius: 999px; margin: 8px 0; box-shadow: var(--shadow); }
.msg { display: flex; flex-direction: column; max-width: 84%; margin-top: 4px; }
.msg.in, .msg.ai { align-self: flex-start; align-items: flex-start; }
.msg.out { align-self: flex-end; align-items: flex-end; }
.msg.wide { max-width: 100%; width: 100%; }
.msg.grouped { margin-top: 0; }
.who { font: 700 12px var(--font-ui); color: var(--ink-2); margin: 0 10px 2px; }
.msg.ai .who { color: var(--purple); }
.msg.out .who { color: var(--orange); }
.bubble { position: relative; padding: 7px 10px 5px; border-radius: 16px; font-size: 15px; line-height: 1.4; background: var(--surface); box-shadow: 0 1px 1px rgba(28, 39, 51, .08); max-width: 100%; overflow-wrap: anywhere; }
.bubble p { margin: 0; }
.msg.in .bubble { border-top-left-radius: 5px; }
.msg.out .bubble { background: #FCE6D7; color: var(--ink); border-top-right-radius: 5px; }
:root[data-theme="dark"] .msg.out .bubble { background: #3D2A1F; }
.msg.ai .bubble { background: var(--purple-soft); border-top-left-radius: 5px; box-shadow: inset 3px 0 0 var(--purple); }
.meta { float: right; margin: 6px 0 -2px 10px; display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--ink-3); }
.meta .ic { width: 13px; height: 13px; color: var(--blue); }
.msg.out .meta .ic { color: var(--orange); }
.media { padding: 4px; }
.img { margin: 0; width: 230px; max-width: 100%; }
.img-frame { height: 150px; border-radius: 12px; background: linear-gradient(135deg, var(--tone), color-mix(in srgb, var(--tone) 45%, #2A3A4D)); display: grid; place-items: center; color: rgba(255, 255, 255, .9); overflow: hidden; }
.img-frame .ic { width: 34px; height: 34px; }
.img-frame img { width: 100%; height: 100%; object-fit: cover; }
.img figcaption { font-size: 12px; margin: 5px 6px 2px; color: var(--ink-2); }
.file { display: flex; gap: 10px; align-items: center; min-width: 210px; }
.file > .ic { width: 36px; height: 36px; padding: 8px; border-radius: 12px; background: var(--surface-2); color: var(--orange); box-sizing: border-box; }
.file b { display: block; font-size: 14px; }
.file small { font-size: 12px; color: var(--ink-2); }
.voice { display: flex; align-items: center; gap: 10px; min-width: 220px; }
.play { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--blue); color: #fff; display: grid; place-items: center; flex: none; }
.play .ic { width: 14px; height: 14px; }
.wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 26px; min-width: 0; color: var(--blue); }
.wave i { flex: 1; background: currentColor; opacity: .45; border-radius: 2px; min-height: 4px; width: 3px; }
.voice small { font-size: 12px; color: var(--ink-2); }
.carousel { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 8px; width: 100%; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.car-card { flex: none; width: 214px; scroll-snap-align: start; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
.car-img { height: 92px; background: linear-gradient(135deg, var(--tone), color-mix(in srgb, var(--tone) 40%, #2A3A4D)); display: grid; place-items: center; color: rgba(255, 255, 255, .92); }
.car-img .ic { width: 30px; height: 30px; }
.car-card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; flex: 1; }
.car-card b { font: 600 14px var(--font-ui); }
.car-card small { color: var(--ink-2); font-size: 12px; }
.car-meta { margin-top: auto; padding-top: 6px; }

        if (child.nodeType === 3) continue;

      }
    });
    const idleMins = (Date.now() - state.lastActive) / 60000;
    if (state.autoAway && me().status === 'available' && idleMins >= state.autoAway) {
      me().status = 'away';
      changed = true;
      toast('You were away for a while, so your status changed to Away.');
    }
    if (changed) render();
    else updateCountdowns();
  }
  function updateCountdowns() {
    document.querySelectorAll('[data-countdown]').forEach((el) => {
      const u = userById(el.dataset.countdown);
      if (u && u.breakEnd) el.textContent = fmtMs(u.breakEnd - Date.now());
    });
  }

  let toastTimer = null;
  function toast(msg, undo) {
    state.toast = { msg, undo };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { state.toast = null; render(); }, 4200);
  }

  function render() {
    const ae = document.activeElement;
    const focusKey = ae && ae.dataset ? ae.dataset.key : null;
    const wasEditor = !!(ae && ae.hasAttribute && ae.hasAttribute('data-editor'));
    const caret = focusKey && ae.selectionStart != null ? ae.selectionStart : null;
    const prevContent = $('.content', root);
    const prevMsgs = $('.msgs', root);
    const sc = prevContent ? prevContent.scrollTop : 0;
    const ms = prevMsgs ? prevMsgs.scrollTop : 0;

    document.documentElement.dataset.theme = state.theme;
    if (state.convId && !current()) state.convId = null;
    root.innerHTML = shell();

    const content = $('.content', root);
    if (content) content.scrollTop = sc;
    const msgs = $('.msgs', root);
    if (msgs) msgs.scrollTop = state.scrollBottom ? msgs.scrollHeight : ms;
    state.scrollBottom = false;

    if (focusKey) {
      const el = $(`[data-key="${focusKey}"]`, root);
      if (el) {
        el.focus({ preventScroll: true });
        if (caret != null && el.setSelectionRange) { try { el.setSelectionRange(caret, caret); } catch (_) { } }
      }
    }
    if (wasEditor) {
      const ed = $('[data-editor]', root);
      if (ed) focusEnd(ed);
    }
  }

  function focusEnd(el) {
    el.focus({ preventScroll: true });
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }

  function shell() {
    const c = current();
    return `<div class="phone">
      ${renderHome()}
      ${renderTabbar()}
      ${state.toast ? `<div class="toast" role="status"><span>${esc(state.toast.msg)}</span>${state.toast.undo ? '<button data-act="undo">Undo</button>' : ''}</div>` : ''}
    </div>`;
  }

  const roleSeg = () => `<div class="seg mini" role="group" aria-label="View as">${['admin', 'agent'].map((r) => `<button class="${me().role === r ? 'on' : ''}" data-act="role" data-role="${r}" aria-pressed="${me().role === r}">${r === 'admin' ? 'Admin' : 'Agent'}</button>`).join('')}</div>`;
  const topbar = (title, sub, right = '') => `<header class="topbar"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="tb-right">${right}</div></header>`;

  function renderTabbar() {
    const unread = CONVS.filter((c) => c.status === 'open' && c.unread).length;
    const tabs = [
      ['home', 'Home', 'home', 0],
      ['inbox', 'Inbox', 'inbox', unread],
      ['settings', 'Settings', 'settings', 0],
    ];
    return `<nav class="tabbar" aria-label="Main">${tabs.map(([k, l, i, b]) => `<button class="tab ${state.tab === k ? 'on' : ''}" data-act="tab" data-tab="${k}" ${state.tab === k ? 'aria-current="page"' : ''}>${ic(i)}<span>${l}</span>${b ? `<span class="badge" aria-label="${b} unread">${b}</span>` : ''}</button>`).join('')}</nav>`;
  }

  function statusSeg() {
    const keys = ['available', 'busy', 'away', 'offline'];
    return `<div class="status-seg">${keys.map((k) => `<button class="${me().status === k ? 'on' : ''}" data-act="set-status" data-s="${k}" style="--s:${STATUS[k].color}" aria-pressed="${me().status === k}"><i></i>${STATUS[k].label}</button>`).join('')}</div>`;
  }

  function renderHome() {
    const u = me();
    const mine = CONVS.filter((c) => c.status === 'open' && c.assignee === u.id);
    const waiting = CONVS.filter((c) => c.status === 'open' && !c.assignee).length;
    const slaRisk = CONVS.filter((c) => c.status === 'open' && (c.priority === 'urgent' || c.priority === 'high') && (c.assignee === u.id || !c.assignee));

    return `${topbar(`Hi, ${firstName(u)}`, `${mine.length} chats assigned · ${waiting} waiting`, roleSeg())}
      <div class="content">
        <div class="card">${statusSeg()}</div>
        <div class="kpis">
          <div class="kpi"><span>Assigned to you</span><b>${mine.length}</b></div>
          <div class="kpi ${slaRisk.length ? 'alert' : ''}"><span>SLA at risk</span><b>${slaRisk.length}</b></div>
        </div>
        <p class="label">Needs you next</p>
        <div class="list">${visibleConvs().slice(0, 3).map(convCard).join('') || '<div class="empty"><p>All caught up!</p></div>'}</div>
      </div>`;
  }

  function convCard(c) {
    const ct = contactOf(c);
    const last = lastMsg(c);
    return `<article class="conv" data-act="conv" data-id="${c.id}" tabindex="0">
      ${av(ct, '', c.channel)}
      <div class="conv-body">
        <div class="row1"><b>${esc(ct.name)}</b><time>${rel(last.time)}</time></div>
        <p class="prev"><span>${esc(preview(last)).slice(0, 60)}</span></p>
      </div>
      ${c.unread ? `<span class="badge">${c.unread}</span>` : ''}
    </article>`;
  }

  function renderSettings() {
    const u = me();
    return `${topbar('Settings', `${esc(u.name)} · ${u.role === 'admin' ? 'Admin' : 'Agent'}`)}
      <div class="content">
        <div class="group">
          ${['light', 'dark'].map((t) => `<button class="setrow" data-act="theme" data-t="${t}" style="cursor:pointer"><span><b>${t === 'light' ? '☀️ Light' : '🌙 Dark'}</b></span>${state.theme === t ? ic('check') : ''}</button>`).join('')}
        </div>
        <p class="label">Preferences</p>
        <div class="group">
          <div class="setrow"><span><b>Auto-away</b><small>After ${state.autoAway || 'never'} min idle</small></span></div>
          <div class="rule"><div><b>Status after break</b></div>
            <select class="select" data-act="returnstatus" style="width:120px">${['available', 'busy'].map((k) => `<option value="${k}" ${state.returnStatus === k ? 'selected' : ''}>${STATUS[k].label}</option>`).join('')}</select></div>
        </div>
      </div>`;
  }

  function render() {
    const ae = document.activeElement;
    const focusKey = ae && ae.dataset ? ae.dataset.key : null;
    const prevContent = $('.content', root);
    const sc = prevContent ? prevContent.scrollTop : 0;

    document.documentElement.dataset.theme = state.theme;
    root.innerHTML = shell();

    const content = $('.content', root);
    if (content) content.scrollTop = sc;
  }

  // Event listeners
  root.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const d = el.dataset;
    state.lastActive = Date.now();
    switch (d.act) {
      case 'tab': state.tab = d.tab; break;
      case 'role': state.me = d.role === 'admin' ? 'u-ayo' : 'u-sara'; toast(`Viewing as ${me().name}`); break;
      case 'conv': openConv(d.id); break;
      case 'set-status': setStatus(d.s); break;
      case 'theme': state.theme = d.t; saveTheme(d.t); break;
      case 'returnstatus': state.returnStatus = el.value; break;
    }
    render();
  });

  root.addEventListener('change', (e) => {
    if (e.target.dataset.act === 'returnstatus') state.returnStatus = e.target.value;
    render();
  });

  function openConv(id) {
    state.convId = id;
    const c = convById(id);
    c.unread = 0;
    state.draftHtml = '';
    render();
  }

  setInterval(tickClock, 1000);
  render();
})();
  </script>
</body>
</html>
